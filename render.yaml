# Render Blueprint for NeuroDecode Demo deployment
# Deploy: Connect repo to Render and it will auto-detect this file

services:
  # Backend API Service (Lightweight Demo)
  - type: web
    name: neurodecode-api
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    plan: free
    region: oregon
    buildFilter:
      paths:
        - src/backend/main_demo.py
        - requirements-demo.txt
        - Dockerfile.demo
